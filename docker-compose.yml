services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: midfunnel
      POSTGRES_PASSWORD: midfunnel
      POSTGRES_DB: midfunnel_dev
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U midfunnel"]
      interval: 2s
      timeout: 3s
      retries: 20
